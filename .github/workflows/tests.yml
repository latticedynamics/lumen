name: tests

# CPU-only, hosted runners, by decision rather than by limitation.  What CI can
# verify here is the reference path, the windowed-vs-dense equivalence, the
# step-vs-forward equivalence, and every piece of pure logic -- which is a large
# share of the risk, and is exactly why `arch_facts` was separated from device
# access in the first place.
#
# The Triton kernels and the hardware measurements are covered locally:
#
#     pytest -m "gpu or triton"
#
# run before tagging.  Anything a hosted runner cannot check is a reason to keep
# the reference path exact, not a reason to lower the bar.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is requires-python in pyproject.toml, not a guess.  Every
        # version in this list is a version the package claims to support.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install torch (CPU wheel)
        # The default index serves CUDA-linked wheels: gigabytes of driver
        # payload that a hosted runner has no device for.  torch stays
        # unpinned -- pinning it is how a library becomes uninstallable on the
        # hardware it claims to support.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install lumen
        run: pip install -e '.[dev]'

      - name: Report what this runner actually is
        # The house rule is to measure rather than assume, and that applies to
        # CI too: if a failure is environmental, this is the block that says so.
        run: |
          python -c "
          import sys, torch
          print(f'python {sys.version.split()[0]}')
          print(f'torch  {torch.__version__}')
          print(f'cuda   {torch.cuda.is_available()}')
          try:
              import triton; print(f'triton {triton.__version__}')
          except ImportError:
              print('triton not installed (expected here)')
          "

      - name: Test
        run: pytest -m "not gpu and not triton" -q
